# Vigilancia del backend en Render — NO es el keep-alive.
#
# Este workflow nació como keep-alive con `cron: '*/10 * * * *'` y no funcionó.
# Medición del 2026-11-04 sobre los runs reales: 8 ejecuciones en 48 h, separadas
# entre 5 y 8 horas, en vez de las ~288 que implicaría el cron. GitHub Actions
# desprioriza y SALTA los schedules frecuentes; no hay forma de exigirle
# puntualidad. Como Render suspende el servicio tras 15 min sin tráfico, esos
# pocos despertares dejaban el backend dormido ~97 % del tiempo.
#
# Cuota de Neon (2026-11-22): mantener el backend despierto 24/7 con un pinger cada
# 5 min mantuvo el cómputo de Neon activo todo el mes y agotó las 100 CU-horas del
# plan gratuito (la base quedó caída hasta el reinicio de cuota). Por eso YA NO se
# mantiene nada despierto: el backend puede dormirse y cada ping lo despierta.
# Cada despertar cuesta ~9 min de cómputo en Neon (~3,5 min de arranque + 5 min de
# suspensión), así que cuantos menos pings, más margen. Ver docs/backend-plan.md,
# sección 16.3.
#
# Este workflow verifica y FALLA cuando el backend no responde 200, para que GitHub
# mande el email de workflow fallido y el problema se note acá en vez de
# descubrirlo abriendo la app. Corre cada 6 h (4 despertares al día como máximo).

name: Backend Health Watch

on:
  schedule:
    # Cada 6 h. Cada ejecución despierta el backend y la base de Neon, así que
    # una frecuencia alta gasta la cuota de cómputo. Si GitHub se salta alguna,
    # no pasa nada: esto es vigilancia.
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: backend-health-watch
  cancel-in-progress: false

jobs:
  watch:
    name: verificar que el backend responda
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Consultar /actuator/health
        id: health
        run: |
          set -o pipefail

          # 300 s cubre el arranque en frio por si el servicio estaba suspendido
          # cuando llego este chequeo. Medicion de 6 arranques reales: 188-214 s.
          #
          # El tiempo se mide sobre ESTE sondeo, no sobre uno posterior: si el
          # primero ya desperto el servicio, cualquier sondeo siguiente responde
          # rapido y la deteccion de "estaba dormido" seria inalcanzable.
          probe=$(curl -s -o response.txt --max-time 300             -w '%{http_code} %{time_total}'             https://korofin-backend.onrender.com/actuator/health || echo '000 0')

          http_code=${probe%% *}
          elapsed=${probe##* }

          echo "http_code=$http_code"
          echo "tiempo del sondeo: ${elapsed}s"
          if [ -f response.txt ]; then echo "respuesta: $(cat response.txt)"; fi

          if [ "$http_code" != "200" ]; then
            echo "::error::El backend no respondio 200 (http_code=$http_code). El servicio no arranca o la base de datos no responde (cuota de Neon agotada?)."
            exit 1
          fi

          # Un backend despierto responde en ~1-5 s. Tardar mas significa que
          # estaba dormido y este sondeo lo desperto: es lo esperado ahora que no
          # hay keep-alive, asi que solo se informa.
          if awk "BEGIN { exit !($elapsed > 15) }"; then
            echo "::notice::El backend estaba dormido y este sondeo lo desperto (${elapsed}s)."
          fi

          echo "Backend arriba, sondeo en ${elapsed}s."
