name: Mobile Distribute

on:
  push:
    branches:
      - main
    paths:
      - 'korofin_mobile/**'

permissions:
  contents: read

concurrency:
  group: mobile-distribute-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribute:
    name: distribute
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: korofin_mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Version fijada a la de desarrollo local. Sin esto el job toma la ultima
          # estable, y una version nueva de Flutter puede romper `flutter analyze`
          # con deprecaciones sin que cambie el codigo (paso con material.dart).
          flutter-version: 3.47.0

      - name: Instalar dependencias
        run: flutter pub get

      - name: Build APK de release
        run: flutter build apk --release --dart-define=API_BASE_URL=https://korofin-backend.onrender.com

      - name: Subir a Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: korofin_mobile/build/app/outputs/flutter-apk/app-release.apk
