# Perfil de test (nuevo respecto a FinSmart - ver docs/backend-plan.md seccion 15): valores
# minimos, sin secretos reales, para que @SpringBootTest/@DataJpaTest levanten. Los tests que
# necesitan Postgres real usan Testcontainers y sobreescriben spring.datasource.* via
# @DynamicPropertySource; los que no tocan JPA en absoluto (ej. @WebMvcTest) ni siquiera activan
# este perfil.

app.jwt.secret=clave-secreta-de-test-suficientemente-larga-para-hmac-sha256-no-usar-en-produccion
app.jwt.issuer=korofin-backend-test
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000

# Sin jobs programados corriendo durante los tests.
app.jobs.enabled=false

spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate

# Limites de rate limiting practicamente desactivados en tests. El RateLimitFilter usa la IP del
# cliente como clave y MockMvc siempre reporta la misma, asi que todos los tests de un mismo
# contexto de Spring comparten balde: con el limite de produccion (3 registros / 300s)
# UserAuthFlowIntegrationTest se pasa solo, porque entre sus tres tests hace cuatro registros, y
# el cuarto recibe 429 en vez del codigo que el test espera. Cual de los tests se come el 429
# depende del orden de ejecucion de JUnit, lo que hacia fallar el CI de forma aparentemente
# aleatoria. El comportamiento del rate limiter tiene su propia cobertura en RateLimitFilterTest
# e InMemoryRateLimiterTest, que construyen el filtro directamente con sus propios valores y no
# dependen de estas propiedades.
app.rate-limit.login.max-requests=100000
app.rate-limit.register.max-requests=100000
app.rate-limit.ai-chat.max-requests=100000
app.rate-limit.receipt-scan.max-requests=100000
