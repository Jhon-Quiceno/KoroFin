# Overrides de produccion. Todo valor de conexion/secreto sigue viniendo de variables de entorno
# via el application.properties base - este perfil solo endurece lo que es seguro exponer en un
# entorno vivo: sin logging SQL/debug, sin Swagger/API docs, sin live-reload de devtools.

spring.jpa.show-sql=false

logging.level.com.korofin.backend=INFO
logging.level.org.hibernate.SQL=WARN

# Swagger/API docs son solo una comodidad de dev local; se mantienen apagados en produccion.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Defensivo: spring-boot-devtools ya se autodesactiva cuando corre desde un jar empaquetado, pero
# esto lo hace explicito sin importar como se lance la app.
spring.devtools.restart.enabled=false
