spring.application.name=korofin-backend
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# Cloud Run (y la mayoria de plataformas de contenedores) inyectan PORT y esperan que la app
# escuche en ese puerto
server.port=${PORT:8080}

# Base de datos
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${DB_PORT_EXTERNAL}/${DB_NAME}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# El mail es opcional y degrada de forma silenciosa cuando no esta configurado (llega con el
# dominio notification en una fase posterior); el health check autoconfigurado no lo sabe, asi
# que se excluye de /actuator/health.
management.health.mail.enabled=false

# Swagger / OpenAPI (springdoc 3.x)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# JWT. Sin las propiedades de cookie de FinSmart (refresh-cookie-name/secure/same-site):
# KoroFin es mobile-only, el refresh token nunca viaja en cookie (ver plan-backend.md seccion 3.2).
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER}
app.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Rate limiting en memoria (ventana fija) - fase 1 solo tiene reglas para login/register; las
# reglas de ai-chat/receipt-scan las agrega la fase de IA cuando ese dominio exista.
app.rate-limit.login.max-requests=${RATE_LIMIT_LOGIN_MAX_REQUESTS:5}
app.rate-limit.login.window-seconds=${RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
app.rate-limit.register.max-requests=${RATE_LIMIT_REGISTER_MAX_REQUESTS:3}
app.rate-limit.register.window-seconds=${RATE_LIMIT_REGISTER_WINDOW_SECONDS:300}

# Mail (Resend SMTP) - opcional y degradable, el primer consumidor real llega con el dominio
# notification (fase posterior). "resend" es el usuario SMTP fijo de Resend (no es un secreto);
# la API key es la contraseña.
spring.mail.host=smtp.resend.com
spring.mail.port=587
spring.mail.username=resend
spring.mail.password=${RESEND_API_KEY:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:}

# Automatizaciones programadas nativas (todavia sin jobs en esta fase - llegan con los dominios
# de notification/recurringpayment/card). app.jobs.enabled es el interruptor maestro: en false
# apaga @EnableScheduling por completo (ej. en tests que no necesitan jobs corriendo).
app.jobs.enabled=${APP_JOBS_ENABLED:true}
