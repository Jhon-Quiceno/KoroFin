spring.application.name=korofin-backend
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# Cloud Run (y la mayoria de plataformas de contenedores) inyectan PORT y esperan que la app
# escuche en ese puerto
server.port=${PORT:8080}

# Base de datos
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${DB_PORT_EXTERNAL}/${DB_NAME}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# El mail es opcional y degrada de forma silenciosa cuando no esta configurado (dominio
# notification, EmailNotificationSender); el health check autoconfigurado no lo sabe, asi que se
# excluye de /actuator/health.
management.health.mail.enabled=false

# Swagger / OpenAPI (springdoc 3.x)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# JWT. Sin las propiedades de cookie de FinSmart (refresh-cookie-name/secure/same-site):
# KoroFin es mobile-only, el refresh token nunca viaja en cookie (ver plan-backend.md seccion 3.2).
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER}
app.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Rate limiting en memoria (ventana fija): login/register (solo IP) y ai-chat/receipt-scan
# (IP+userId, dominio ai).
app.rate-limit.login.max-requests=${RATE_LIMIT_LOGIN_MAX_REQUESTS:5}
app.rate-limit.login.window-seconds=${RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
app.rate-limit.register.max-requests=${RATE_LIMIT_REGISTER_MAX_REQUESTS:3}
app.rate-limit.register.window-seconds=${RATE_LIMIT_REGISTER_WINDOW_SECONDS:300}
app.rate-limit.ai-chat.max-requests=${RATE_LIMIT_AI_CHAT_MAX_REQUESTS:10}
app.rate-limit.ai-chat.window-seconds=${RATE_LIMIT_AI_CHAT_WINDOW_SECONDS:60}
app.rate-limit.receipt-scan.max-requests=${RATE_LIMIT_RECEIPT_SCAN_MAX_REQUESTS:10}
app.rate-limit.receipt-scan.window-seconds=${RATE_LIMIT_RECEIPT_SCAN_WINDOW_SECONDS:60}

# Proveedores de IA (dominio ai, fase 4) - catalogo fijo + registro + orquestador con fallback en
# cascada (ver docs/backend-plan.md seccion 4). Un proveedor solo se habilita si su api-key tiene
# valor; AI_PROVIDER_PRIORITY es opcional (default: gemini -> nvidia -> opencode -> openrouter ->
# groq, ver AiProviderRegistry).
app.ai.priority=${AI_PROVIDER_PRIORITY:}
app.ai.providers.nvidia.api-key=${NVIDIA_API_KEY:}
app.ai.providers.nvidia.model=${NVIDIA_MODEL:}
app.ai.providers.nvidia.vision-model=${NVIDIA_VISION_MODEL:}
app.ai.providers.gemini.api-key=${GEMINI_API_KEY:}
app.ai.providers.gemini.model=${GEMINI_MODEL:}
app.ai.providers.gemini.vision-model=${GEMINI_VISION_MODEL:}
app.ai.providers.opencode.api-key=${OPENCODE_API_KEY:}
app.ai.providers.opencode.model=${OPENCODE_MODEL:}
app.ai.providers.openrouter.api-key=${OPENROUTER_API_KEY:}
app.ai.providers.openrouter.model=${OPENROUTER_MODEL:}
app.ai.providers.openrouter.vision-model=${OPENROUTER_VISION_MODEL:}
app.ai.providers.groq.api-key=${GROQ_API_KEY:}
app.ai.providers.groq.model=${GROQ_MODEL:}

# Prioridad de proveedores POR TAREA (opcional): si se configura, sobreescribe app.ai.priority
# solo para ese tipo de operacion (ver AiUsageEventType). Mismo formato que app.ai.priority.
app.ai.task-priority.chat=${AI_TASK_PRIORITY_CHAT:}
app.ai.task-priority.categorize=${AI_TASK_PRIORITY_CATEGORIZE:}
app.ai.task-priority.insight=${AI_TASK_PRIORITY_INSIGHT:}
app.ai.task-priority.statement_extract=${AI_TASK_PRIORITY_STATEMENT_EXTRACT:}

app.ai.monthly-message-limit=${AI_MONTHLY_MESSAGE_LIMIT:5}
app.ai.read-timeout-seconds=${AI_READ_TIMEOUT_SECONDS:60}

# Mail (Resend SMTP) - opcional y degradable, consumido por EmailNotificationSender (dominio
# notification). "resend" es el usuario SMTP fijo de Resend (no es un secreto); la API key es la
# contraseña.
spring.mail.host=smtp.resend.com
spring.mail.port=587
spring.mail.username=resend
spring.mail.password=${RESEND_API_KEY:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:}

# Automatizaciones programadas nativas (dominios notification/recurringpayment + infraestructura
# service/scheduling). app.jobs.enabled es el interruptor maestro: en false apaga
# @EnableScheduling por completo (ej. en tests que no necesitan jobs corriendo) - cada
# @ConditionalOnProperty individual de los jobs tambien lo respeta.
app.jobs.enabled=${APP_JOBS_ENABLED:true}
app.jobs.payment-reminder.cron=${APP_JOBS_PAYMENT_REMINDER_CRON:0 0 8 * * *}
app.jobs.weekly-summary.cron=${APP_JOBS_WEEKLY_SUMMARY_CRON:0 0 7 * * MON}
app.jobs.inactivity-reminder.cron=${APP_JOBS_INACTIVITY_REMINDER_CRON:0 0 9 * * *}
app.jobs.card-cycle-close.cron=${APP_JOBS_CARD_CYCLE_CLOSE_CRON:0 0 6 * * *}
app.jobs.month-end-prediction.cron=${APP_JOBS_MONTH_END_PREDICTION_CRON:0 30 8 * * *}

# Importacion de extractos bancarios (dominio statement, fase 5): limite de tamano de archivo
# subido por multipart/form-data. max-request-size es un poco mayor que max-file-size para dejar
# margen al resto del multipart (boundary, otros campos del form).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Integracion de Telegram (dominio integration, fase 7) - opcional y apagada por defecto: un
# TELEGRAM_WEBHOOK_SECRET vacio hace que TelegramWebhookFilter rechace las tres rutas de webhook
# siempre con 401 (ver docs/backend-plan.md seccion 5). n8n es el unico llamador de esas rutas.
app.telegram.webhook-secret=${TELEGRAM_WEBHOOK_SECRET:}
app.telegram.link-code.ttl-seconds=${TELEGRAM_LINK_CODE_TTL_SECONDS:300}
app.telegram.rate-limit.max-requests=${TELEGRAM_RATE_LIMIT_MAX_REQUESTS:5}
app.telegram.rate-limit.window-seconds=${TELEGRAM_RATE_LIMIT_WINDOW_SECONDS:60}
