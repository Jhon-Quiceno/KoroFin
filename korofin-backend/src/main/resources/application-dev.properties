# Overrides solo para desarrollo local. Todo valor de conexion/secreto sigue viniendo de
# variables de entorno via el application.properties base (spring.datasource.*, app.jwt.*, etc.)
# - este perfil solo ajusta ergonomia de dev local: logging SQL verboso y exposicion completa de
# Swagger.

# Muestra el SQL generado para facilitar debug de repositorios/queries en local. Se loguea una
# sola vez via el logger org.hibernate.SQL de abajo (no via spring.jpa.show-sql, que lo
# imprimiria una segunda vez por el printer propio de stdout de Hibernate). hibernate.format_sql
# sigue aplicando al output basado en logger, asi que el pretty-print se conserva.
spring.jpa.properties.hibernate.format_sql=true

logging.level.com.korofin.backend=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Exposicion completa de API docs/Swagger UI para exploracion manual local.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
