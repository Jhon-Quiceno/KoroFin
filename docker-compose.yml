services:
  db:
    image: postgres:16-alpine
    container_name: korofin-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT_EXTERNAL}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: ./korofin-backend
    container_name: korofin-app
    ports:
      - "8080:8080"
    environment:
      # Sin esto el contenedor corre en UTC. Cualquier fecha calculada por el servidor (ej. el
      # gasto que crea el bot de Telegram con "fecha de hoy") queda desalineada con la hora local
      # del usuario si no se fija el timezone del contenedor.
      TZ: ${APP_TIMEZONE:-America/Bogota}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS}
      AI_PROVIDER_PRIORITY: ${AI_PROVIDER_PRIORITY}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      NVIDIA_MODEL: ${NVIDIA_MODEL}
      NVIDIA_VISION_MODEL: ${NVIDIA_VISION_MODEL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      GEMINI_VISION_MODEL: ${GEMINI_VISION_MODEL}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY}
      OPENCODE_MODEL: ${OPENCODE_MODEL}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL}
      OPENROUTER_VISION_MODEL: ${OPENROUTER_VISION_MODEL}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL}
      AI_MONTHLY_MESSAGE_LIMIT: ${AI_MONTHLY_MESSAGE_LIMIT}
      AI_READ_TIMEOUT_SECONDS: ${AI_READ_TIMEOUT_SECONDS}
      RESEND_API_KEY: ${RESEND_API_KEY}
      MAIL_FROM: ${MAIL_FROM}
      # Secreto compartido con n8n para los endpoints de /api/integrations/telegram/*
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  n8n-db:
    image: postgres:16-alpine
    container_name: korofin-n8n-db
    environment:
      POSTGRES_DB: ${N8N_DB_NAME}
      POSTGRES_USER: ${N8N_DB_USER}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
    volumes:
      - n8n_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${N8N_DB_USER} -d ${N8N_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: korofin-n8n
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME}
      DB_POSTGRESDB_USER: ${N8N_DB_USER}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      # URL publica por la que Telegram llega a n8n para registrar el webhook (requiere HTTPS).
      # En local hace falta un tunel; vacio = n8n arma la URL con N8N_PROTOCOL+N8N_HOST+N8N_PORT,
      # que no sirve para el Telegram Trigger sin tunel.
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      # Las expresiones de n8n no leen $env por defecto (seguridad). El workflow de Telegram
      # referencia {{ $env.TELEGRAM_WEBHOOK_SECRET }} en los nodos HTTP Request, asi que hace
      # falta habilitarlo explicitamente. Aceptable en un entorno local de desarrollo.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_SECURE_COOKIE: false
      GENERIC_TIMEZONE: America/Bogota
      N8N_DEFAULT_BINARY_DATA_MODE: default
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      n8n-db:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data:
  n8n_postgres_data:
  n8n_data:
